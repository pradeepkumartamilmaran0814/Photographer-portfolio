{% extends "dashboard/base.html" %}

{% block content %}
<div class="db-card" style="max-width: 650px; margin: 0 auto;">
    <div class="db-card-header">
        <div>
            <div class="db-card-title">Edit Career Experience</div>
            <div style="font-size: 0.8rem; color: var(--db-text-muted); margin-top: 4px;">
                Displayed on the /about page under "Discover My Journey in Design".
            </div>
        </div>
        <a href="{% url 'portfolio:dashboard_page_about' %}" class="btn btn-outline btn-sm">
            ← Back to About Page
        </a>
    </div>

    <form method="POST" class="db-card-body">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Job Role / Title</label>
            <input type="text" name="role" class="form-control" value="{{ experience.role }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Company / Studio Name</label>
            <input type="text" name="company" class="form-control" value="{{ experience.company }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Period / Years</label>
            <input type="text" name="period" class="form-control" value="{{ experience.period }}" placeholder="2023 - Present" required>
        </div>

        <div class="form-group">
            <label class="form-label">Description (Optional)</label>
            <textarea name="description" class="form-control" rows="3">{{ experience.description }}</textarea>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Display Order</label>
            <input type="number" name="order" class="form-control" value="{{ experience.order }}" style="width: 100px;">
        </div>

        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--db-border); display: flex; justify-content: flex-end; gap: 12px;">
            <a href="{% url 'portfolio:dashboard_page_about' %}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-accent" style="padding: 10px 24px;">✓ Save Experience</button>
        </div>
    </form>
</div>
{% endblock %}
