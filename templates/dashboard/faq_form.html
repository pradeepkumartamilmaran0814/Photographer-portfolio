{% extends "dashboard/base.html" %}

{% block content %}
<div class="db-card" style="max-width: 800px; margin: 0 auto;">
    <div class="db-card-header">
        <div>
            <div class="db-card-title">{% if is_edit %}Edit FAQ{% else %}Add New FAQ{% endif %}</div>
            <div style="font-size: 0.8rem; color: var(--db-text-muted); margin-top: 4px;">
                Changes saved here will immediately sync to the "Frequently Asked Questions" section on the home page.
            </div>
        </div>
        <a href="{% url 'portfolio:dashboard_faqs' %}" class="btn btn-outline btn-sm">
            ← Back to FAQs
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 120px 1fr; gap: 16px;">
            <div class="form-group">
                <label class="form-label">Order #</label>
                <input type="text" name="order_num" class="form-control" value="{{ faq.order_num|default:'1.' }}" placeholder="1." maxlength="5" data-char-hint="e.g. 1., 02." required>
            </div>
            <div class="form-group">
                <label class="form-label">Question</label>
                <input type="text" name="question" class="form-control" value="{{ faq.question|default:'' }}" placeholder="e.g. What services do you offer?" maxlength="100" data-char-rec="20–80 chars" data-char-hint="FAQ question title in accordion" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Answer Text</label>
            <textarea name="answer" class="form-control" rows="5" placeholder="e.g. I offer comprehensive design solutions including UI/UX design, web design, and branding." maxlength="350" data-char-rec="60–250 chars" data-char-hint="Accordion body content">{{ faq.answer|default:'' }}</textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label class="form-label">Display Order</label>
                <input type="number" name="order" class="form-control" value="{{ faq.order|default:'0' }}">
            </div>
            <div class="form-group" style="display: flex; align-items: center; margin-top: 28px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff;">
                    <input type="checkbox" name="is_active" {% if not is_edit or faq.is_active %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--db-accent);">
                    <span>Display on Website (Active)</span>
                </label>
            </div>
        </div>

        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--db-border); display: flex; justify-content: flex-end; gap: 12px;">
            <a href="{% url 'portfolio:dashboard_faqs' %}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-accent">
                {% if is_edit %}Save Changes & Sync UI{% else %}Add FAQ & Sync UI{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
